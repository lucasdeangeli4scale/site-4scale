<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Formulário 4SCALE</title>
  </head>
  <body>
    <form name="briefing" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="briefing" />
      <input type="text" name="nome" />
      <input type="text" name="empresa" />
      <input type="email" name="email" />
      <input type="tel" name="whatsapp" />
      <select name="interesse">
        <option>Ecossistema Completo (Marketing + Tecnologia)</option>
        <option>Marketing Digital &amp; Performance</option>
        <option>Inteligência Artificial &amp; Dados</option>
        <option>Automação &amp; Processos</option>
        <option>Software, Apps &amp; E-commerce</option>
      </select>
      <textarea name="desafio"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
